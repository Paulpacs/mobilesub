<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050807">
<title>Paulpacs Solar — Mobile Submarine</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --brass: #c9a227;
    --brass-light: #e8c95a;
    --brass-dark: #7a6010;
    --sonar: #6bffb8;
    --sonar-dim: #2a8a5c;
    --red: #ff4d4d;
    --amber: #ffb84d;
    --cyan: #30e5ff;
    --metal: #0d1210;
    --metal-light: #1a221e;
  }

  body {
    background:
      radial-gradient(ellipse at 50% 0%, #0d1411 0%, #000 75%),
      repeating-linear-gradient(0deg, rgba(0,0,0,.4) 0px, rgba(0,0,0,.4) 1px, transparent 1px, transparent 3px);
    margin: 0; min-height: 100vh;
    font-family: 'Courier New', ui-monospace, monospace;
    color: var(--sonar);
    -webkit-font-smoothing: antialiased;
    padding-bottom: 60px;
  }

  /* CRT scanline overlay */
  body::after {
    content: ''; position: fixed; inset: 0; z-index: 999; pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent 0, transparent 2px, rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 4px);
  }

  /* HEADER */
  .header {
    text-align: center; padding: 14px 10px 10px;
    position: sticky; top: 0; z-index: 100;
    background: linear-gradient(to bottom, rgba(0,0,0,0.95) 70%, transparent);
    backdrop-filter: blur(4px);
  }
  .header h1 {
    margin: 0; font-size: 22px; font-weight: 900; letter-spacing: 6px;
    color: var(--brass-light);
    text-shadow: 0 0 4px var(--brass), 0 0 12px rgba(201,162,39,.5);
  }
  .header p {
    margin: 2px 0 0; font-size: 8px; color: var(--sonar);
    letter-spacing: 4px; font-weight: bold;
    text-shadow: 0 0 6px var(--sonar);
  }
  .clock {
    margin-top: 8px; display: inline-block;
    font-size: 12px; color: var(--sonar); letter-spacing: 2px;
    font-weight: bold; font-variant-numeric: tabular-nums;
    padding: 3px 14px;
    border: 1px solid var(--sonar-dim);
    border-radius: 4px;
    background: rgba(0,20,10,.8);
    box-shadow: inset 0 0 8px rgba(107,255,184,.15), 0 0 8px rgba(107,255,184,.2);
  }

  /* DASHBOARD LAYOUT */
  .dashboard {
    display: flex; flex-direction: column; gap: 14px;
    padding: 12px; max-width: 600px; margin: 0 auto;
  }

  /* PANELS */
  .panel {
    position: relative;
    background: linear-gradient(160deg, var(--metal-light) 0%, var(--metal) 40%, #050807 100%);
    border: 1px solid var(--brass-dark);
    border-radius: 8px;
    padding: 12px 10px 10px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 4px 12px rgba(0,0,0,.6);
  }
  .panel::after {
    content: ''; position: absolute; inset: 3px; border-radius: 5px;
    border: 1px solid rgba(201,162,39,.15); pointer-events: none;
  }
  /* Rivets */
  .panel::before {
    content: ''; position: absolute; inset: 5px; border-radius: 6px; pointer-events: none;
    background:
      radial-gradient(circle at 6px 6px, #4a4a4a 1.5px, transparent 2px),
      radial-gradient(circle at calc(100% - 6px) 6px, #4a4a4a 1.5px, transparent 2px),
      radial-gradient(circle at 6px calc(100% - 6px), #4a4a4a 1.5px, transparent 2px),
      radial-gradient(circle at calc(100% - 6px) calc(100% - 6px), #4a4a4a 1.5px, transparent 2px);
    opacity: .6;
  }

  .panel-title {
    font-size: 9px; font-weight: 900; letter-spacing: 2px;
    text-transform: uppercase; margin-bottom: 10px;
    color: var(--brass-light); display: flex; align-items: center; gap: 6px;
    text-shadow: 0 0 4px rgba(201,162,39,.5);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; box-shadow: 0 0 6px currentColor; animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }

  /* TOP ROW GAUGES (3 columns) */
  .gauge-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  
  .gauge-mini {
    position: relative; aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, #0a1812 0%, #000 75%);
    box-shadow: inset 0 0 15px rgba(0,0,0,.9), 0 0 0 2px #0a0f0c, 0 0 0 4px var(--brass-dark), 0 0 0 5px rgba(201,162,39,.3);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 10px;
  }
  .gauge-mini svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(135deg); }
  .gauge-mini .track { fill: none; stroke: rgba(107,255,184,.08); stroke-linecap: round; }
  .gauge-mini .value-arc { fill: none; stroke-linecap: round; transition: stroke-dashoffset .8s cubic-bezier(.4,0,.2,1); filter: drop-shadow(0 0 4px currentColor); }
  
  .gauge-mini .val { font-size: 18px; font-weight: 900; line-height: 1; z-index: 2; text-shadow: 0 0 8px currentColor; }
  .gauge-mini .unit { font-size: 7px; opacity: .8; margin-top: 2px; z-index: 2; letter-spacing: 1px; }
  .gauge-mini .sub { font-size: 6px; opacity: .6; margin-top: 2px; z-index: 2; text-transform: uppercase; }

  /* MIDDLE ROW (Large Grid Gauge + Meters) */
  .gauge-grid-2 { display: grid; grid-template-columns: 1fr 1.2fr; gap: 10px; }

  .gauge-large {
    position: relative; aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, #0a1812 0%, #000 75%);
    box-shadow: inset 0 0 20px rgba(0,0,0,.9), 0 0 0 3px #0a0f0c, 0 0 0 5px var(--brass-dark), 0 0 0 6px rgba(201,162,39,.4);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .gauge-large svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(135deg); }
  .gauge-large .val { font-size: 26px; font-weight: 900; line-height: 1; z-index: 2; text-shadow: 0 0 10px currentColor; }
  .gauge-large .unit { font-size: 9px; opacity: .8; margin-top: 2px; z-index: 2; letter-spacing: 2px; }
  .gauge-large .sub { font-size: 8px; opacity: .6; margin-top: 4px; z-index: 2; letter-spacing: 1px; text-transform: uppercase; }

  /* METERS (Level Indicators) */
  .level-indicators { display: flex; flex-direction: column; justify-content: center; gap: 10px; }
  
  .level-group { display: flex; flex-direction: column; gap: 4px; }
  .level-label { display: flex; justify-content: space-between; font-size: 8px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--sonar); opacity: .85; }
  .level-value { color: #eafff5; text-shadow: 0 0 6px rgba(107,255,184,.5); }
  
  .level-track {
    height: 12px; border-radius: 2px; background: #000; overflow: hidden; position: relative;
    border: 1px solid var(--brass-dark); box-shadow: inset 0 0 6px rgba(0,0,0,.9);
    background-image: repeating-linear-gradient(90deg, transparent 0, transparent calc(10% - 1px), rgba(201,162,39,.2) calc(10% - 1px), rgba(201,162,39,.2) 10%);
  }
  .level-fill {
    height: 100%; width: 0%; transition: width .8s cubic-bezier(.4,0,.2,1);
    box-shadow: 0 0 8px currentColor, inset 0 0 6px rgba(255,255,255,.3);
  }
  .level-fill::after {
    content: ''; position: absolute; inset: 0;
    background: repeating-linear-gradient(90deg, transparent 0, transparent 2px, rgba(0,0,0,.3) 2px, rgba(0,0,0,.3) 3px);
  }

  /* STATS */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
  .stat {
    background: rgba(0,0,0,.6); border: 1px solid rgba(107,255,184,.12);
    border-radius: 4px; padding: 6px 8px;
  }
  .stat .k { font-size: 7px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; opacity: .55; }
  .stat .v { font-size: 13px; font-weight: 900; margin-top: 2px; font-variant-numeric: tabular-nums; color: #eafff5; text-shadow: 0 0 6px rgba(107,255,184,.4); }
  .stat .v small { font-size: 8px; font-weight: bold; opacity: .7; }

  .status-on   { color: #6bffb8 !important; }
  .status-off  { color: #ff4d4d !important; text-shadow: 0 0 6px #ff4d4d !important; }
  .status-idle { color: #888 !important; text-shadow: none !important; }

  /* CHART PANEL */
  .chart-panel { padding: 12px 10px 10px; }
  .chart-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .chart-head .panel-title { margin: 0; border: none; padding: 0; }
  .legend { display: flex; gap: 8px; }
  .legend-item { display: flex; align-items: center; gap: 4px; font-size: 7px; font-weight: 800; letter-spacing: 1px; }
  .legend-swatch { width: 8px; height: 3px; border-radius: 1px; box-shadow: 0 0 4px currentColor; }
  
  .chart-wrapper {
    position: relative; height: 160px; width: 100%;
    border: 1px solid rgba(107,255,184,.2); border-radius: 4px;
    background: linear-gradient(rgba(107,255,184,.04) 1px, transparent 1px) 0 0 / 100% 25%, radial-gradient(ellipse at 50% 50%, #061a10 0%, #000 80%);
    box-shadow: inset 0 0 20px rgba(0,0,0,.9);
    overflow: hidden;
  }
  .chart-wrapper canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }

  /* BOTTOM NAV */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
    background: linear-gradient(to top, rgba(0,0,0,0.95) 80%, transparent);
    padding: 10px 0 14px; display: flex; justify-content: center; gap: 30px;
    pointer-events: none;
  }
  .nav-item { font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: var(--sonar-dim); text-align: center; }
  .nav-item.active { color: var(--brass-light); text-shadow: 0 0 6px var(--brass); }
  .nav-item::before { content: '◆'; display: block; font-size: 10px; margin-bottom: 4px; }

</style>
</head>
<body>

<div class="header">
  <h1>PAULPACS</h1>
  <p>MOBILE SUBMARINE CONSOLE</p>
  <div class="clock" id="clock">--:--:--</div>
</div>

<div class="dashboard">

  <!-- TOP ROW: SMALL GAUGES -->
  <div class="gauge-grid-3">
    <!-- PV -->
    <div class="gauge-mini">
      <svg viewBox="0 0 100 100">
        <circle class="track" cx="50" cy="50" r="42" stroke-width="6" stroke-dasharray="198 264"></circle>
        <circle class="value-arc" id="pvArc" cx="50" cy="50" r="42" stroke="#30e5ff" stroke-width="6" stroke-dasharray="198 264" stroke-dashoffset="198"></circle>
      </svg>
      <div class="val" style="color:#30e5ff;" id="pvPower">0</div>
      <div class="unit">WATTS</div>
      <div class="sub" id="pvSub">PROJ</div>
    </div>
    <!-- Battery -->
    <div class="gauge-mini">
      <svg viewBox="0 0 100 100">
        <circle class="track" cx="50" cy="50" r="42" stroke-width="6" stroke-dasharray="198 264"></circle>
        <circle class="value-arc" id="socArc" cx="50" cy="50" r="42" stroke="#6bffb8" stroke-width="6" stroke-dasharray="198 264" stroke-dashoffset="198"></circle>
      </svg>
      <div class="val" style="color:#6bffb8;" id="soc">0</div>
      <div class="unit">% SOC</div>
      <div class="sub" id="socSub">IDLE</div>
    </div>
    <!-- Inverter -->
    <div class="gauge-mini">
      <svg viewBox="0 0 100 100">
        <circle class="track" cx="50" cy="50" r="42" stroke-width="6" stroke-dasharray="198 264"></circle>
        <circle class="value-arc" id="invArc" cx="50" cy="50" r="42" stroke="#6bffb8" stroke-width="6" stroke-dasharray="198 264" stroke-dashoffset="198"></circle>
      </svg>
      <div class="val" style="color:#6bffb8;" id="invLoad">0</div>
      <div class="unit">WATTS</div>
      <div class="sub">INVERTER</div>
    </div>
  </div>

  <!-- MIDDLE ROW: GRID GAUGE + METERS -->
  <div class="panel">
    <div class="panel-title"><span class="dot" style="background:#ff4d4d;color:#ff4d4d"></span>GRID & LEVELS</div>
    
    <div class="gauge-grid-2">
      <!-- Large Grid Gauge -->
      <div class="gauge-large">
        <svg viewBox="0 0 100 100">
          <circle class="track" cx="50" cy="50" r="42" stroke-width="6" stroke-dasharray="198 264"></circle>
          <circle class="value-arc" id="gridArc" cx="50" cy="50" r="42" stroke="#ff4d4d" stroke-width="6" stroke-dasharray="198 264" stroke-dashoffset="198"></circle>
        </svg>
        <div class="val" style="color:#ff4d4d;" id="gridPowerG">0</div>
        <div class="unit">WATTS</div>
        <div class="sub" id="gridStatus">OFFLINE</div>
      </div>

      <!-- Level Indicators -->
      <div class="level-indicators">
        <div class="level-group">
          <div class="level-label"><span>1ST FLOOR</span><span class="level-value" id="floor1">0 W</span></div>
          <div class="level-track"><div class="level-fill" id="floor1Bar" style="background:#30e5ff;color:#30e5ff"></div></div>
        </div>
        <div class="level-group">
          <div class="level-label"><span>2ND FLOOR</span><span class="level-value" id="floor2">0 W</span></div>
          <div class="level-track"><div class="level-fill" id="floor2Bar" style="background:#ffb84d;color:#ffb84d"></div></div>
        </div>
        <div class="level-group">
          <div class="level-label"><span>UTILISATION</span><span class="level-value" id="invPctLabel">0%</span></div>
          <div class="level-track"><div class="level-fill" id="invBar" style="background:#6bffb8;color:#6bffb8"></div></div>
        </div>
      </div>
    </div>

    <!-- Secondary Stats -->
    <div class="stats">
      <div class="stat"><div class="k">PV VOLTAGE</div><div class="v"><span id="pvVolt">0</span><small> V</small></div></div>
      <div class="stat"><div class="k">MPPT</div><div class="v status-idle" id="mppt" style="font-size:11px;">IDLE</div></div>
      <div class="stat"><div class="k">BATT VOLTAGE</div><div class="v"><span id="battVolt">0</span><small> V</small></div></div>
      <div class="stat"><div class="k">CHARGE CURRENT</div><div class="v"><span id="battAmps">0.0</span><small> A</small></div></div>
      <div class="stat"><div class="k">GRID POWER</div><div class="v"><span id="gridPower">0</span><small> W</small></div></div>
      <div class="stat"><div class="k">GRID VOLTAGE</div><div class="v"><span id="gridVolt">224</span><small> V</small></div></div>
    </div>
  </div>

  <!-- CHART PANEL -->
  <div class="panel chart-panel">
    <div class="chart-head">
      <div class="panel-title"><span class="dot" style="background:var(--sonar);color:var(--sonar)"></span>POWER SONAR</div>
      <div class="legend">
        <div class="legend-item"><span class="legend-swatch" style="background:#30e5ff;color:#30e5ff"></span>PV</div>
        <div class="legend-item"><span class="legend-swatch" style="background:#6bffb8;color:#6bffb8"></span>INV</div>
        <div class="legend-item"><span class="legend-swatch" style="background:#ff4d4d;color:#ff4d4d"></span>GRID</div>
      </div>
    </div>
    <div class="chart-wrapper">
      <canvas id="powerChart"></canvas>
    </div>
  </div>

</div>

<div class="bottom-nav">
  <div class="nav-item active">SONAR</div>
  <div class="nav-item">SYSTEM</div>
  <div class="nav-item">POWER</div>
</div>

<script>
/* ---------- CLOCK ---------- */
function tick() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('en-US', { hour12: false }) + ' · ' +
    now.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' }).toUpperCase();
}
setInterval(tick, 1000); tick();

/* ---------- ARC GAUGE HELPER ----------
   Small gauges: r=42, circumference ≈ 264. 75% arc = 198.
   Large gauge:  same calculation applies. */
function setArc(arcId, frac) {
  const el = document.getElementById(arcId);
  if (!el) return;
  const f = Math.max(0, Math.min(1, frac));
  el.style.strokeDashoffset = 198 - (198 * f);
}

/* ---------- MULTI-LINE CHART ---------- */
const MAX_POINTS = 30; // Short history for mobile
const series = {
  pv:   { data: [], color: '#30e5ff', fill: 'rgba(48,229,255,0.10)'  },
  inv:  { data: [], color: '#6bffb8', fill: 'rgba(107,255,184,0.10)' },
  grid: { data: [], color: '#ff4d4d', fill: 'rgba(255,77,77,0.10)'   }
};

const chartCanvas = document.getElementById('powerChart');
const chartCtx = chartCanvas.getContext('2d');

function resizeChart() {
  const dpr = window.devicePixelRatio || 1;
  chartCanvas.width  = chartCanvas.clientWidth  * dpr;
  chartCanvas.height = chartCanvas.clientHeight * dpr;
  chartCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawChart();
}
window.addEventListener('resize', resizeChart);

function drawChart() {
  const w = chartCanvas.clientWidth;
  const h = chartCanvas.clientHeight;
  const padL = 30, padR = 6, padT = 8, padB = 14;
  const plotW = w - padL - padR;
  const plotH = h - padT - padB;

  chartCtx.clearRect(0, 0, w, h);

  let maxVal = 100;
  Object.values(series).forEach(s => {
    s.data.forEach(v => { if (v > maxVal) maxVal = v; });
  });
  maxVal = Math.ceil(maxVal / 500) * 500;

  chartCtx.font = '8px "Courier New", monospace';
  chartCtx.textAlign = 'right';
  chartCtx.textBaseline = 'middle';
  chartCtx.lineWidth = 1;
  
  const steps = 3;
  for (let i = 0; i <= steps; i++) {
    const val = (maxVal / steps) * i;
    const y = padT + plotH - (plotH * (i / steps));

    chartCtx.strokeStyle = 'rgba(107,255,184,0.15)';
    chartCtx.setLineDash([2, 3]);
    chartCtx.beginPath();
    chartCtx.moveTo(padL, y);
    chartCtx.lineTo(w - padR, y);
    chartCtx.stroke();

    chartCtx.fillStyle = 'rgba(107,255,184,0.6)';
    chartCtx.fillText(Math.round(val) + 'W', padL - 4, y);
  }
  chartCtx.setLineDash([]);

  for (let i = 0; i <= 4; i++) {
    const x = padL + (plotW / 4) * i;
    chartCtx.strokeStyle = 'rgba(107,255,184,0.08)';
    chartCtx.setLineDash([2, 3]);
    chartCtx.beginPath();
    chartCtx.moveTo(x, padT);
    chartCtx.lineTo(x, padT + plotH);
    chartCtx.stroke();
  }
  chartCtx.setLineDash([]);

  Object.values(series).forEach(s => {
    const data = s.data;
    if (data.length < 1) return;

    const xFor = i => padL + (i / (MAX_POINTS - 1)) * plotW;
    const yFor = v => padT + plotH - (Math.min(v, maxVal) / maxVal) * plotH;

    chartCtx.beginPath();
    chartCtx.moveTo(xFor(0), yFor(data[0]));
    for (let i = 1; i < data.length; i++) chartCtx.lineTo(xFor(i), yFor(data[i]));
    chartCtx.lineTo(xFor(data.length - 1), padT + plotH);
    chartCtx.lineTo(xFor(0), padT + plotH);
    chartCtx.closePath();
    chartCtx.fillStyle = s.fill;
    chartCtx.fill();

    chartCtx.save();
    chartCtx.shadowColor = s.color;
    chartCtx.shadowBlur = 6;
    chartCtx.beginPath();
    for (let i = 0; i < data.length; i++) {
      const x = xFor(i), y = yFor(data[i]);
      i ? chartCtx.lineTo(x, y) : chartCtx.moveTo(x, y);
    }
    chartCtx.strokeStyle = s.color;
    chartCtx.lineWidth = 1.5;
    chartCtx.lineJoin = 'round';
    chartCtx.stroke();
    chartCtx.restore();

    const lastX = xFor(data.length - 1);
    const lastY = yFor(data[data.length - 1]);
    chartCtx.beginPath();
    chartCtx.arc(lastX, lastY, 2.5, 0, Math.PI * 2);
    chartCtx.fillStyle = s.color;
    chartCtx.fill();
  });

  chartCtx.fillStyle = 'rgba(107,255,184,0.5)';
  chartCtx.font = '7px "Courier New", monospace';
  chartCtx.textAlign = 'right';
  chartCtx.textBaseline = 'top';
  chartCtx.fillText('NOW', w - padR, padT + plotH + 4);
}

function pushSample(pv, inv, grid) {
  [ [series.pv, pv], [series.inv, inv], [series.grid, grid] ].forEach(([s, v]) => {
    s.data.push(v);
    if (s.data.length > MAX_POINTS) s.data.shift();
  });
  drawChart();
}

/* ---------- DATA FETCH ---------- */
const pvMax = 2000, invMax = 2000, gridMax = 2000, socMax = 100;

async function fetchData() {
  try {
    const res = await fetch('https://solar-proxy.pcgpacana.workers.dev');
    if (!res.ok) throw new Error("HTTP " + res.status);
    const d = await res.json();

    const pvPower   = d.v12 || 0;
    const pvVolt    = d.v13 || 0;
    const invPower  = d.v6  || 0;
    const gridPower = d.v15 || 0;
    const floor2    = d.v7  || 0;
    const floor1    = Math.max(0, gridPower - floor2);
    const battVolt  = d.v2  || 0;
    const irr       = d.v16 || 0;
    const cloud     = d.v17 || 0;
    const soc       = d.v18 || 0;
    const projected = (irr / 1000) * 1785;

    /* PV */
    document.getElementById('pvPower').textContent = Math.round(pvPower);
    setArc('pvArc', pvPower / pvMax);
    document.getElementById('pvVolt').textContent = pvVolt.toFixed(1);
    document.getElementById('pvSub').textContent = 'PROJ ' + Math.round(projected) + ' W';
    
    const mppt = document.getElementById('mppt');
    if (pvPower === 0 && pvVolt === 0) { mppt.textContent='IDLE'; mppt.className='v status-idle'; }
    else if (pvVolt > 120)            { mppt.textContent='REJECT'; mppt.className='v status-off'; }
    else                              { mppt.textContent='ACCEPT'; mppt.className='v status-on'; }

    /* Battery */
    document.getElementById('soc').textContent = Math.round(soc);
    setArc('socArc', soc / socMax);
    document.getElementById('battVolt').textContent = battVolt.toFixed(2);

    const totalLoad = invPower + (invPower > 0 ? 100 : 0);
    const diff = pvPower - totalLoad;
    const ampsEl = document.getElementById('battAmps');
    const subSoc = document.getElementById('socSub');
    if (diff > 10) {
      ampsEl.textContent = '+' + (diff / battVolt).toFixed(1);
      ampsEl.style.color = '#6bffb8'; subSoc.textContent = 'CHARGING'; subSoc.style.color='#6bffb8';
    } else if (diff < -10) {
      ampsEl.textContent = '-' + (Math.abs(diff) / battVolt).toFixed(1);
      ampsEl.style.color = '#ff4d4d'; subSoc.textContent = 'DISCHARGING'; subSoc.style.color='#ff4d4d';
    } else {
      ampsEl.textContent = '0.0';
      ampsEl.style.color = '#888'; subSoc.textContent = 'IDLE'; subSoc.style.color='#888';
    }

    /* Inverter */
    document.getElementById('invLoad').textContent = Math.round(invPower);
    setArc('invArc', invPower / invMax);
    
    const invPct = Math.min(100, Math.round((invPower / invMax) * 100));
    document.getElementById('invPctLabel').textContent = invPct + '%';
    document.getElementById('invBar').style.width = invPct + '%';

    /* Grid */
    document.getElementById('gridPower').textContent = Math.round(gridPower);
    document.getElementById('gridPowerG').textContent = Math.round(gridPower);
    setArc('gridArc', gridPower / gridMax);
    
    const gs = document.getElementById('gridStatus');
    if (d.v8 === 0) {
      gs.textContent = 'ONLINE'; gs.className='sub status-on';
    } else {
      gs.textContent = 'OFFLINE'; gs.className='sub status-off';
    }

    /* Floors */
    document.getElementById('floor1').textContent = Math.round(floor1) + ' W';
    document.getElementById('floor2').textContent = Math.round(floor2) + ' W';
    document.getElementById('floor1Bar').style.width = Math.min(100, (floor1 / gridMax) * 100) + '%';
    document.getElementById('floor2Bar').style.width = Math.min(100, (floor2 / gridMax) * 100) + '%';

    /* Chart */
    pushSample(pvPower, invPower, gridPower);

  } catch (e) {
    console.error('Data fetch failed', e);
  }
}

requestAnimationFrame(() => { resizeChart(); });
fetchData();
setInterval(fetchData, 60000);
</script>
